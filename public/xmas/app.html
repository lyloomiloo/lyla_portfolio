<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// Phones get the clear (non-refracting) glass: transmission renders milky on many mobile GPUs.
// HOST is rewritten to 'web' by build-web.py for lylahuang.com/xmas (real .glb, server share links).
const HOST = 'web';
const WEB = HOST === 'web';
const EMBED = WEB && /[?&]embed=1/.test(location.search); // live preview inside the portfolio's Projects window
if (EMBED) document.documentElement.classList.add('embed');
const gltfLoader = () => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const PHONE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 820;
const LOW = EMBED || /[?&]q=low/.test(location.search) || (PHONE && !/[?&]q=high/.test(location.search));
const HDRI = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/christmas_photo_studio_04_1k.hdr'; // CC0, Poly Haven

/* ---------------- procedural textures ---------------- */
function canvasTex(w, h, draw, { srgb = true, repeat = null } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  t.anisotropy = 8;
  return t;
}
// turned-wood grain: rings run around the base
const woodTex = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#cfcfcf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const y = Math.random() * h, a = 0.04 + Math.random() * 0.12, amp = 2 + Math.random() * 6, f = 0.004 + Math.random() * 0.01;
    g.strokeStyle = `rgba(40,20,10,${a})`; g.lineWidth = 0.6 + Math.random() * 2.2;
    g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x * f + i) * amp);
    g.stroke();
  }
});
// table planks
const plankTex = canvasTex(1024, 1024, (g, w, h) => {
  const pw = w / 5;
  for (let p = 0; p < 5; p++) {
    const tone = 150 + Math.random() * 40;
    g.fillStyle = `rgb(${tone},${tone * 0.72},${tone * 0.5})`; g.fillRect(p * pw, 0, pw, h);
    for (let i = 0; i < 70; i++) {
      const x = p * pw + Math.random() * pw, amp = 2 + Math.random() * 5;
      g.strokeStyle = `rgba(60,30,15,${0.05 + Math.random() * 0.12})`; g.lineWidth = 0.5 + Math.random() * 2;
      g.beginPath(); for (let y = 0; y <= h; y += 10) g.lineTo(x + Math.sin(y * 0.01 + i) * amp, y); g.stroke();
    }
    g.fillStyle = 'rgba(30,15,5,0.55)'; g.fillRect(p * pw, 0, 3, h);
  }
}, { repeat: [2, 2] });
// soft fade so the table melts into the blurred room
const fadeTex = canvasTex(256, 256, (g, w, h) => {
  const rg = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
  rg.addColorStop(0, '#fff'); rg.addColorStop(0.35, '#fff'); rg.addColorStop(0.95, '#000'); rg.addColorStop(1, '#000');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
}, { srgb: false });
// snow: bumpy normal map from noise
const snowNormal = (() => {
  const S = 256, hgt = new Float32Array(S * S);
  for (let o = 0; o < 4; o++) {
    const n = 8 << o, grid = Array.from({ length: (n + 1) * (n + 1) }, () => Math.random());
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const gx = x / S * n, gy = y / S * n, x0 = gx | 0, y0 = gy | 0, fx = gx - x0, fy = gy - y0;
      const at = (i, j) => grid[(j % n) * (n + 1) + (i % n)];
      const v = at(x0, y0) * (1 - fx) * (1 - fy) + at(x0 + 1, y0) * fx * (1 - fy) + at(x0, y0 + 1) * (1 - fx) * fy + at(x0 + 1, y0 + 1) * fx * fy;
      hgt[y * S + x] += v / (1 << o);
    }
  }
  return canvasTex(S, S, (g) => {
    const img = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const h = (i, j) => hgt[((j + S) % S) * S + ((i + S) % S)];
      const dx = (h(x + 1, y) - h(x - 1, y)) * 3, dy = (h(x, y + 1) - h(x, y - 1)) * 3;
      const k = (y * S + x) * 4;
      img.data[k] = 128 - dx * 127; img.data[k + 1] = 128 - dy * 127; img.data[k + 2] = 255; img.data[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, { srgb: false, repeat: [6, 6] });
})();

/* ---------------- constants ---------------- */
const R = 2.25;                 // dome radius
const C = Math.sqrt(R * R - 2.2 * 2.2); // dome sphere centre height (sphere meets base at r=2.2, y=0)
const G = 2.12;                 // usable ground radius
const groundY = r => 0.06 * Math.max(0, 1 - (r / 2.2) ** 2);

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; // warmer, richer than AgX for this scene
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
// real room photo for reflections + a soft, out-of-focus background
// Magnific-generated Christmas workshop, wrapped all around the scene (background + reflections)
new THREE.TextureLoader().load('workshop-env.jpg', tex => {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  // the room itself, mostly desaturated: soft natural reflections without a brown cast or hard studio panels
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  scene.backgroundBlurriness = 0.05; // a touch of depth of field so the globe stays the focus
  applySettings();
}, undefined, () => console.warn('workshop image failed to load; using studio fallback'));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, null));
let gtao = null;
function setupAO() {
  if (LOW || PHONE) return;
  gtao = new GTAOPass(scene, camera, 256, 256);
  gtao.blendIntensity = 0.75;
  gtao.updateGtaoMaterial({ radius: 0.7, distanceExponent: 1.4, thickness: 1.0, scale: 1.7, samples: 16 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
  const aoRender = gtao.render.bind(gtao);
  gtao.render = (...args) => {
    const hidden = [];
    scene.traverse(o => { if (o.visible && (o.isPoints || o === domeGroup)) { o.visible = false; hidden.push(o); } });
    try { aoRender(...args); } finally { hidden.forEach(o => o.visible = true); }
  };
  composer.insertPass(gtao, 1); // right after the scene render, before bloom
}
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.5, 1.6); // only lights/emissives glow
composer.addPass(bloom);
composer.addPass(new OutputPass());
if (LOW) bloom.enabled = false;

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 200); // ~50mm look, matching the location shot
scene.background = new THREE.Color(0x2a1c12);
composer.passes[0].camera = camera;
setupAO();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enablePan = false;
controls.zoomToCursor = true; // pinch/scroll zooms toward what you point at
controls.zoomSpeed = 1.1;
controls.enableDamping = true;
controls.minPolarAngle = 0.6;
controls.maxPolarAngle = 1.48;
controls.rotateSpeed = 0.7;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 15 });
sun.shadow.bias = -0.0015;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const glow = new THREE.PointLight(0xffb565, 0, 5, 2); // warm inner light at night
glow.position.set(-0.6, 2.1, -0.4); // high and behind: rim light, not a flash
scene.add(glow);

/* ---------------- materials ---------------- */
const matCache = {};
const M = (color, o = {}) => {
  const key = color + JSON.stringify(o);
  // glazed, hand-painted ceramic look
  return matCache[key] ||= new THREE.MeshPhysicalMaterial({ color, roughness: 0.55, clearcoat: 0.45, clearcoatRoughness: 0.35, flatShading: true, ...o });
};
const windowMat = new THREE.MeshStandardMaterial({ color: 0xffd58a, emissive: 0xffb44d, emissiveIntensity: 0.4, roughness: 0.6 });
const lampMat = new THREE.MeshStandardMaterial({ color: 0xfff1c9, emissive: 0xffc061, emissiveIntensity: 0.6, roughness: 0.5 });
const starMat = new THREE.MeshStandardMaterial({ color: 0xffd76a, emissive: 0xffb92e, emissiveIntensity: 0.8, metalness: 0.4, roughness: 0.35 });
const SNOW = 0xf7fbff;

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ---------------- base, ground, dome ---------------- */
const BASES = {
  caramel:  { label: 'Caramel',  color: 0xa8612f, trim: 0xd4ae62, strap: 0x6e3a1a },
  noir:     { label: 'Noir',     color: 0x1d1714, trim: 0xd8b56a, strap: 0x0d0a08 },
  ivory:    { label: 'Ivory',    color: 0xe9dfcc, trim: 0xc9a35a, strap: 0xa8612f },
  bordeaux: { label: 'Bordeaux', color: 0x5e1620, trim: 0xd8b56a, strap: 0x2e0a10 },
  pink:      { label: 'Pink',        color: 0xd9a3a3, trim: 0xd4ae62, strap: 0xb97a7c },
  white:     { label: 'White',       color: 0xeee6d6, trim: 0xd4ae62, strap: 0xc08a52 },
  darkbrown: { label: 'Dark brown',  color: 0x3e2618, trim: 0xd4ae62, strap: 0x2a180e },
  emerald:  { label: 'Emerald',  color: 0x1d4a3a, trim: 0xd8b56a, strap: 0x0f2a20 },
  blush:    { label: 'Blush',    color: 0xd9a8a0, trim: 0xd8b56a, strap: 0xa8665e },
};
/* steamer-trunk base: leather body, brass corners, straps, lock */
const TW = 5.0, TD = 4.8, TH = 1.6, TOP = -0.1, BOT = TOP - TH;
const leatherNormal = snowNormal.clone(); leatherNormal.repeat.set(14, 14); leatherNormal.needsUpdate = true;
const baseMat = new THREE.MeshPhysicalMaterial({ color: 0xa8612f, roughness: 0.55, normalMap: leatherNormal, normalScale: new THREE.Vector2(0.35, 0.35), clearcoat: 0.35, clearcoatRoughness: 0.5, sheen: 0.4, sheenColor: 0xffd9b0 });
const strapMat = new THREE.MeshPhysicalMaterial({ color: 0x6e3a1a, roughness: 0.6, normalMap: leatherNormal, normalScale: new THREE.Vector2(0.3, 0.3), clearcoat: 0.2 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0xd4ae62, metalness: 1, roughness: 0.28 });
const trunk = new THREE.Group(); scene.add(trunk);
const tmesh = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; trunk.add(m); return m; };
const CY = (TOP + BOT) / 2;
tmesh(new RoundedBoxGeometry(TW, TH, TD, 4, 0.1), baseMat, 0, CY, 0);
// lid seam: brass band around the trunk
const seamY = TOP - 0.42;
tmesh(new RoundedBoxGeometry(TW + 0.04, 0.07, TD + 0.04, 2, 0.03), trimMat, 0, seamY, 0);
tmesh(new RoundedBoxGeometry(TW + 0.04, 0.06, TD + 0.04, 2, 0.03), trimMat, 0, BOT + 0.05, 0);
// leather straps over the front, top and back
for (const x of [-1.45, 1.45]) {
  tmesh(new RoundedBoxGeometry(0.34, TH + 0.03, TD + 0.05, 2, 0.04), strapMat, x, CY, 0);
  tmesh(new THREE.BoxGeometry(0.2, 0.18, 0.04), trimMat, x, seamY - 0.25, TD / 2 + 0.04); // buckle
}
// brass corner caps
const cornerGeo = new RoundedBoxGeometry(0.42, 0.42, 0.42, 3, 0.08);
for (const sx of [-1, 1]) for (const sy of [TOP - 0.18, BOT + 0.18]) for (const sz of [-1, 1])
  tmesh(cornerGeo, trimMat, sx * (TW / 2 - 0.17), sy, sz * (TD / 2 - 0.17));
// studs along the seam
const studGeo = new THREE.SphereGeometry(0.035, 10, 8);
for (let i = -7; i <= 7; i++) if (Math.abs(i) > 1) tmesh(studGeo, trimMat, i * 0.3, seamY - 0.1, TD / 2 + 0.01);
// lock + padlock
tmesh(new RoundedBoxGeometry(0.55, 0.5, 0.06, 2, 0.03), trimMat, 0, seamY - 0.05, TD / 2 + 0.03);
tmesh(new RoundedBoxGeometry(0.26, 0.24, 0.1, 2, 0.04), trimMat, 0, seamY - 0.32, TD / 2 + 0.09);
const shackle = tmesh(new THREE.TorusGeometry(0.08, 0.022, 10, 20, Math.PI), trimMat, 0, seamY - 0.2, TD / 2 + 0.09);
// side handles
for (const sx of [-1, 1]) { const h = tmesh(new THREE.TorusGeometry(0.32, 0.05, 10, 24, Math.PI), strapMat, sx * (TW / 2 + 0.06), seamY - 0.35, 0); h.rotation.y = Math.PI / 2; h.rotation.z = Math.PI; }
// brass collar the dome sits in
tmesh(new THREE.CylinderGeometry(2.32, 2.44, -TOP + 0.005, 96), trimMat, 0, TOP / 2, 0).userData.keep = true; // collar stays when the model loads // top sits just under the snow
const base = trunk;
// engraved brass nameplate on the trunk front
const plaqueCanvas = document.createElement('canvas');
plaqueCanvas.width = 1024; plaqueCanvas.height = 200;
const plaqueTex = new THREE.CanvasTexture(plaqueCanvas);
plaqueTex.colorSpace = THREE.SRGBColorSpace; plaqueTex.anisotropy = 4;
const plaque = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.39), new THREE.MeshStandardMaterial({ map: plaqueTex, metalness: 0.9, roughness: 0.3, transparent: true }));
plaque.position.set(0, BOT + 0.5, TD / 2 + 0.012);
scene.add(plaque);
function drawPlaque(text) {
  const g = plaqueCanvas.getContext('2d');
  g.clearRect(0, 0, 1024, 200);
  plaque.visible = !!text;
  if (!text) return;
  const grad = g.createLinearGradient(0, 0, 0, 200);
  const PL = { brass: ['#f2dc9c', '#c99b42', '#a37828', '#3e2810'], silver: ['#f4f6f9', '#bcc3cc', '#8f98a4', '#2a2e33'],
    rosegold: ['#f7d3c0', '#d89c80', '#b4775c', '#4a2618'], noir: ['#4b4644', '#2c2826', '#1b1817', '#e6d6b4'] }[state.hw] || ['#f2dc9c', '#c99b42', '#a37828', '#3e2810'];
  grad.addColorStop(0, PL[0]); grad.addColorStop(0.5, PL[1]); grad.addColorStop(1, PL[2]);
  g.fillStyle = grad; g.beginPath(); g.roundRect(8, 8, 1008, 184, 18); g.fill();

    p[i * 3] = Math.sin(a) * 11 + (Math.random() - 0.5); p[i * 3 + 1] = 2.2 + Math.cos(t * Math.PI * 3) * 1.4 + Math.random() * 0.6 + t * 2; p[i * 3 + 2] = -Math.cos(a) * 11;

  const mat = new THREE.ShaderMaterial({

// Published pages can't serve .glb or fetch data: URIs, so models ship as glTF JSON with the
// binary chunk base64-embedded; rebuild a GLB in memory and parse it directly.
async function jsonToGlb(url) {
  const gltf = await (await fetch(url)).json();
  const b64 = gltf.buffers[0].uri.split(',')[1];
  delete gltf.buffers[0].uri;
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const enc = new TextEncoder().encode(JSON.stringify(gltf));
  const jsonLen = Math.ceil(enc.length / 4) * 4, binLen = Math.ceil(bin.length / 4) * 4;
  const out = new Uint8Array(12 + 8 + jsonLen + 8 + binLen);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jsonLen, true); dv.setUint32(16, 0x4E4F534A, true);
  out.fill(0x20, 20, 20 + jsonLen); out.set(enc, 20);
  const o = 20 + jsonLen;
  dv.setUint32(o, binLen, true); dv.setUint32(o + 4, 0x004E4942, true); out.set(bin, o + 8);
  return out.buffer;
}
// Realism pass: turn the models' standard materials into physical ones with a glaze layer.

function glaze(obj, { clearcoat = 0.7, ccRough = 0.12, sheen = 0.25, env = 1.1 } = {}) {
  obj.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial || o.material.isMeshPhysicalMaterial) return;
    const s = o.material, m = new THREE.MeshPhysicalMaterial();
    for (const k of ['map', 'normalMap', 'normalScale', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap', 'alphaMap', 'side', 'transparent', 'opacity', 'vertexColors'])
      if (s[k] !== undefined && s[k] !== null) m[k] = s[k].clone ? s[k].clone() : s[k];
    m.color.copy(s.color); m.emissive.copy(s.emissive); m.emissiveIntensity = s.emissiveIntensity;
    m.roughness = s.roughness; m.metalness = s.metalness;
    if (m.map) m.map = s.map; if (m.normalMap) m.normalMap = s.normalMap; if (m.roughnessMap) m.roughnessMap = s.roughnessMap; if (m.metalnessMap) m.metalnessMap = s.metalnessMap;
    m.clearcoat = clearcoat; m.clearcoatRoughness = ccRough;
    m.sheen = sheen; m.sheenRoughness = 0.5; m.sheenColor.set(0xffffff);
    m.specularIntensity = 0.7; m.envMapIntensity = env;

}

    const ys = new Float32Array(pos.count);

    const sorted = Array.from(ys).sort((a, b) => a - b);
    const lo = sorted[0], top = sorted[Math.floor(sorted.length * 0.985)];

async function preloadModels() {

    try {
      const m = (d.glb.endsWith('.json') ? await loader.parseAsync(await jsonToGlb(d.glb), '') : await loader.loadAsync(d.glb)).scene;
      if (d.yaw) m.rotation.y = THREE.MathUtils.degToRad(d.yaw); // turn the model so it faces the viewer
      m.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
      glaze(m, { clearcoat: 0.75, ccRough: 0.1, sheen: 0.3, env: 1.15 }); // glazed porcelain

      box = new THREE.Box3().setFromObject(m);
      const ctr = box.getCenter(new THREE.Vector3());
      m.position.set(-ctr.x, -box.min.y, -ctr.z);
      const wrap = new THREE.Group(); wrap.add(m);
      const sz = box.getSize(new THREE.Vector3());
      d.r ??= Math.max(sz.x, sz.z) / 2 * 0.85;
      d.top ??= d.height;
      d._model = wrap;
      d.build = g => {
        const inner = d._model.clone(true);

  const r = rOf(item);

  for (let k = 0; k < 16; k++) {
    let moved = false;
    for (const o of itemsGroup.children) {
      if (o === item) continue;
      if (item.userData.def.flat || o.userData.def.flat) continue; // flat things can sit beneath others
      const dx = p.x - o.position.x, dz = p.z - o.position.z;
      const d = Math.hypot(dx, dz), min = (r + rOf(o)) * 0.85;
      if (d < min) {

        p.x += Math.cos(a) * (min - d + 0.01); p.z += Math.sin(a) * (min - d + 0.01); moved = true;
      }
    }
    clampInside(item);

  }

}
function clampInside(item) {
  const r = rOf(item), p = item.position;
  const h = itemHeight(item);
  const Rin = R - 0.08;
  let maxR = G - r;
  if (h > C) maxR = Math.min(maxR, Math.sqrt(Math.max(0, Rin * Rin - (h - C) ** 2)) - r * 0.4);
  maxR = Math.max(0, maxR);
  const len = Math.hypot(p.x, p.z);
  if (len > maxR) { p.x *= maxR / len; p.z *= maxR / len; }

/* ---------------- snow: a liquid-filled globe ----------------
   Flakes are carried by the water: each one relaxes toward the local flow plus its own slow sinking speed.
   A shake starts a vortex (round the centre, up the middle, down the glass) with curl-like turbulence that
   fades over a few seconds. Flakes tumble (spin) and glint when they catch the light, settle on the ground
   AND on top of figurines/roofs, and slide off again if an item is moved. */
const SNOW_TYPES = {
  snow:   { label: 'Snow',        color: 0xf7f9ff, n: 1300, size: [0.012, 0.03], sink: 0.11, glint: 0.7 },
  gold:   { label: 'Gold flakes', color: 0xf0c868, n: 1100, size: [0.012, 0.032], sink: 0.085, glint: 1.0 },
  petals: { label: 'Petals',      color: 0xf2b2c2, n: 420,  size: [0.045, 0.085], sink: 0.06, glint: 0.2 },

  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.5, 'rgba(255,255,255,0.85)'); rg.addColorStop(1, 'rgba(255,255,255,0)');

})();
const snowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { time: { value: 0 }, camPos: { value: new THREE.Vector3() }, color: { value: new THREE.Color() }, glint: { value: 1 }, scale: { value: 300 } },
  vertexShader: `attribute float size; attribute float phase; attribute float spin; attribute float moving;
    uniform float time; uniform vec3 camPos; uniform float scale; uniform float glint; varying float vGlint; varying float vShade;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      // a tumbling flake flashes when its face lines up with the light; settled flakes glint as the viewer moves
      float a = phase + time * spin * (0.25 + 0.75 * moving) + dot(camPos, vec3(1.3, 0.7, 1.1));
      vGlint = pow(max(0.0, sin(a)), 36.0) * glint * 0.6;
      vShade = 0.78 + 0.22 * sin(phase * 3.1 + time * spin * 0.5);
      gl_PointSize = clamp(size * scale / -mv.z, 1.2, 5.0) * (1.0 + vGlint * 0.8); // capped: fine glitter even up close
      gl_Position = projectionMatrix * mv;

  fragmentShader: `uniform vec3 color; varying float vGlint; varying float vShade;

      float cross = max(0.0, 1.0 - abs(c.x) * 9.0) * max(0.0, 1.0 - abs(c.y) * 2.2)
                  + max(0.0, 1.0 - abs(c.y) * 9.0) * max(0.0, 1.0 - abs(c.x) * 2.2);
      vec3 col = color * vShade + vec3(1.0, 0.97, 0.9) * vGlint * (disc + cross);

function buildSnow(type) {

  const pos = new Float32Array(n * 3), vel = new Float32Array(n * 3), settled = new Uint8Array(n);
  const size = new Float32Array(n), phase = new Float32Array(n), spin = new Float32Array(n), moving = new Float32Array(n), sink = new Float32Array(n);

        if (key === 'snow') shakeSnow(0.7);
      };
      seg.appendChild(b);
    }
  });
}
document.getElementById('atelierBtn').onclick = () => { renderSegs(); document.getElementById('engrave').value = state.engrave; atelierSheet.classList.add('open'); };
atelierSheet.addEventListener('click', e => { if (e.target === atelierSheet || e.target.hasAttribute('data-close')) { atelierSheet.classList.remove('open'); if (mode === 'edit') stopTune(); } });
document.getElementById('engrave').addEventListener('input', e => { state.engrave = e.target.value.slice(0, 24); drawPlaque(state.engrave); });
const msgEl = document.getElementById('message'), msgCount = document.getElementById('msgCount');
document.getElementById('styleBtn').onclick = () => { sfx.paper(); msgEl.value = state.text; msgCount.textContent = state.text.length; styleSheet.classList.add('open'); setTimeout(() => msgEl.focus(), 50); };
styleSheet.addEventListener('click', e => { if (e.target === styleSheet || e.target.hasAttribute('data-close')) styleSheet.classList.remove('open'); });
msgEl.addEventListener('input', () => { state.text = msgEl.value.slice(0, 160); msgCount.textContent = state.text.length; });
document.getElementById('soundBtn').onclick = () => {
  soundOn = !soundOn; document.getElementById('soundBtn').style.opacity = soundOn ? 1 : 0.45;
  if (!soundOn) stopTune(); else if (mode !== 'edit') playTune(state.tune);
};

/* ---------------- tray ---------------- */
const CATS = ['Friends', 'Treasures', 'Maisons', 'Forest'];
let curCat = CATS[0], thumbs = {};
function renderTray() {
  const tabs = document.getElementById('tabs');
  if (!tabs.childElementCount) {
    CATS.forEach(c => {
      const b = document.createElement('button'); b.className = 'tab'; b.textContent = c; b.dataset.cat = c;
      b.onclick = () => { curCat = c; renderTray(); };
      tabs.appendChild(b);
    });
    for (const [txt, id] of [['Atelier ✦', 'atelierBtn'], ['Message ✎', 'styleBtn']]) {
      const at = document.createElement('button'); at.className = 'tab'; at.textContent = txt;
      at.onclick = () => document.getElementById(id).click();
      tabs.appendChild(at);
    }
  }
  tabs.querySelectorAll('.tab[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === curCat));
  const items = document.getElementById('items');
  items.replaceChildren(...CATALOG.filter(d => d.cat === curCat).map(d => {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<img src="${thumbs[d.id]}" alt="" width="66" height="66"><span>${d.label}</span>`;
    el.addEventListener('pointerdown', e => trayPointerDown(e, d.id));
    return el;
  }));
  items.scrollLeft = 0;
}

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function loop() {
  if (EMBED && document.hidden) { clock.getDelta(); requestAnimationFrame(loop); return; }
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
  stepSnow(dt, time); stepPuffs(dt);
  itemsGroup.traverse(o => { if (o.userData.spin) o.children[0].rotation.y = time * 1.2; if (o.userData.bob) { o.children[0].position.y = o.userData.bob + Math.sin(time * 1.3 + o.id) * 0.06; o.children[0].rotation.y = Math.sin(time * 0.5 + o.id) * 0.25; } });
  dragLayer.traverse(o => { if (o.userData.spin) o.children[0].rotation.y = time * 1.2; });
  if (drag) drag.item.position.y += Math.sin(time * 6) * 0.002;
  if (selected && mode === 'edit') {
    const wp = selected.getWorldPosition(tmp);
    selRing.position.set(wp.x, wp.y + 0.008, wp.z);
    selRing.scale.setScalar(rOf(selected) * 1.12 * (1 + Math.sin(time * 4) * 0.04));
    wp.y += itemHeight(selected) + 0.1;
    wp.project(camera);
    toolbar.style.left = ((wp.x + 1) / 2 * stage.clientWidth) + 'px';
    toolbar.style.top = Math.max(50, (1 - wp.y) / 2 * stage.clientHeight - 8) + 'px';
  }
  sparkles.uniforms.time.value = time;
  bokeh.uniforms.time.value = time;
  sparkles.uniforms.camPos.value.copy(camera.position);
  sparkles.uniforms.amount.value = 0.35; // subtle glitter in the snow
  // get right up close while decorating; stay outside the glass once it's sealed
  controls.minDistance = mode === 'edit' && !domeGroup.visible ? 1.4 : 3.0;
  // keep the zoom focus inside the globe so you can't lose it
  const tg = controls.target, tr = Math.hypot(tg.x, tg.z);
  if (tr > 1.9) { tg.x *= 1.9 / tr; tg.z *= 1.9 / tr; }
  tg.y = THREE.MathUtils.clamp(tg.y, -0.2, 1.6);
  if (EMBED) {
    embedAng += dt * 0.12;
    const T = new THREE.Vector3(0, 0.55, 0), h = embedDist * Math.cos(0.2), v = embedDist * Math.sin(0.2);
    camera.position.set(T.x + Math.sin(embedAng) * h, T.y + v, T.z + Math.cos(embedAng) * h);
    camera.lookAt(T);
  } else controls.update();
  composer.render();
  watchPerf(dt);
  requestAnimationFrame(loop);
}
// if the phone struggles, drop to lighter glass, no bloom, lower resolution
let perfFrames = 0, perfTime = 0, perfDone = LOW;
function watchPerf(dt) {
  if (perfDone || !domeGroup.visible) return; // judge while the heavy glass is on screen
  perfFrames++;
  if (perfFrames <= 40) return;             // skip the one-off shader compile hitch
  perfTime += dt;
  if (perfFrames < 130) return;
  perfFrames -= 40;
  perfDone = true;
  const fps = perfFrames / perfTime;
  if (fps < 38) {
    glass.material = glassLite; bloom.enabled = false; if (gtao) gtao.enabled = false;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); resize();
    console.info(`Low FPS (${fps.toFixed(0)}), switched to lite quality`);
  }
}

window.__dbg = { shakeSnow: v => shakeSnow(v), stepSnow: (dt, t) => stepSnow(dt, t), snowRings: () => { const b=[0,0,0,0,0]; for (let i=0;i<snow.settled.length;i++){ if(!snow.settled[i]) continue; const r=Math.hypot(snow.pos[i*3],snow.pos[i*3+2])/2.2; b[Math.min(4,Math.floor(r*5))]++; } return b; }, snowInfo: () => snow && { active: snow.active, settled: snow.settled.reduce((a, b) => a + b, 0), n: snow.settled.length }, camera, controls, applySettings, load: d => load(d), flyTo: (x, y, z, dist) => flyTo(new THREE.Vector3(x, y, z), dist, 0.01), packCompact: m => packCompact(m), unpackCompact: c => unpackCompact(c), state, snap: () => snapshot(), select: it => select(it), THREE, scene, renderer, composer, bloom, glass, glassLite, glassReal, table, ground, domeGroup };

async function openFromHash() {
  if (mode === 'view') return;
  let pre = null;
  if (WEB) {
    pre = window.__GLOBE__ || null; // injected by /xmas/g/<id>
    const pm = !pre && location.pathname.match(/\/xmas\/g\/([a-z0-9]+)/);
    if (pm) { try { const r = await fetch('/api/globes?id=' + pm[1]); if (r.ok) pre = (await r.json()).g; else toast('This snow globe could not be found'); } catch {} }
  }
  const m = pre ? ['', 'x', ''] : location.hash.match(/^#([gps])([a-z2-7]+)$/);
  if (!m) return;
  {
    let data = pre;
    try {
      if (pre) {}
      else if (m[1] === 'g') data = await unpackState(m[2]);
      else if (m[1] === 'p') data = await unpackCompact(m[2]);
      else {
        const db = dbCap || await window.claude?.use?.('db');
        const snap = db && await db.doc('globes/' + m[2]).get();
        data = snap?.exists ? snap.data().g : null;
        if (!data) { toast(db ? 'This snow globe could not be found' : 'Sign in to Claude to open this snow globe'); }
      }
    } catch {}
    if (data) {
      mode = 'view';
      document.body.classList.add('view');
      load(data);
      domeGroup.visible = true; glass.material.opacity = 0.1;
      document.getElementById('gate').classList.add('open');
      const msg = document.getElementById('viewMsg');
      if (state.text) { document.getElementById('viewMsgText').textContent = state.text; }
      document.getElementById('openBtn').onclick = () => {
        audio(); requestMotion();
        document.getElementById('gate').classList.remove('open');
        domeGroup.visible = false;
        lowerDome(() => { setTimeout(() => shakeSnow(1.1), 250); playTune(state.tune); if (state.text) setTimeout(() => { msg.style.display = 'block'; sfx.paper(); }, 2500); });
      };
      controls.autoRotate = false; // the view is framed like a photo now
    }
  }
}

window.addEventListener('hashchange', () => {
  if (location.hash === '#' + shareCode) return; // the sender's own seal, not a received link
  openFromHash();
});

/* ---------------- boot ---------------- */
const STARTER = { s: ['caramel', 'gold', 'day', 0, ''], i: [
  { t: 'townhouse', x: -0.4, z: -0.65, r: 0 },
  { t: 'kiosk', x: 0.6, z: -0.85, r: 0 },
  { t: 'fir', x: -1.35, z: -0.05, r: 0 },
  { t: 'fir', x: 1.4, z: -0.1, r: 3 },
  { t: 'balloon', x: -0.2, z: 0.2, r: 0 },
  { t: 'fox', x: 0.3, z: 0.8, r: 7 },
  { t: 'trunks', x: -0.7, z: 0.75, r: 1, c: [{ t: 'cat', r: 0 }] },
  { t: 'lamppost', x: 1.05, z: 0.7, r: 0 },
] };
(async function boot() {
  await document.fonts.ready.catch(() => {});
  if (EMBED) {
    // Showcase preview: only the starter scene's models, sealed, slowly turning, snowing now and then.
    const need = new Set(); const walk = it => { need.add(it.t); (it.c || []).forEach(walk); }; STARTER.i.forEach(walk);
    for (let i = CATALOG.length - 1; i >= 0; i--) if (CATALOG[i].glb && !need.has(CATALOG[i].id)) CATALOG.splice(i, 1);
    await preloadModels();
    await loadSetPieces();
    load(STARTER);
    mode = 'sealed';
    domeGroup.visible = true; domeGroup.position.y = 0; glass.material.opacity = 0.1;
    controls.enabled = false;
    resize(); loop();
    shakeSnow(1);
    setInterval(() => { if (!document.hidden) shakeSnow(0.9); }, 9000);
    document.addEventListener('click', () => window.open('/xmas/', '_blank', 'noopener'));
    return;
  }
  await preloadModels();
  await loadSetPieces();
  thumbs = await makeThumbs();
  renderTray();
  await openFromHash();
  if (mode === 'edit') load(STARTER); // a small starter scene so the globe isn't empty
  resize();
  loop();
})();

document.getElementById('shakeBtn').onclick = () => { audio(); requestMotion(); shakeSnow(1.1); };
document.getElementById('makeBackBtn').onclick = () => {
  if (WEB) { location.href = '/xmas/'; return; }
  try { location.hash = ''; } catch {}
  location.reload();
};
if (!EMBED) renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);
</script>
